name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Protocol tests
        run: npm run test:protocol

      - name: Workflow-plan and artifact regressions
        run: npm run test:workflow-m4

      - name: Security boundary regressions
        run: |
          node tests/test-secure-filesystem-boundary.js
          node tests/test-worker-filesystem-boundary.js
          node tests/test-execution-verifier.js
          node tests/test-worker-task-strict-json-boundary.js

      - name: Plugin end-to-end acceptance
        run: npm test

      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD
