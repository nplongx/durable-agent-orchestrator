name: P3 Distributed Worker
run-name: P3 worker ${{ inputs.dispatch_key }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
      task_id:
        required: true
      lease_id:
        required: true
      attempt:
        required: true
      owner_epoch:
        required: true
      input_commit:
        required: true
      task_payload_ref:
        required: true
      role:
        required: true
        default: executor
      dispatch_key:
        required: false
      task_payload_json:
        required: false
        default: ''

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id }}
      TASK_ID: ${{ inputs.task_id }}
      LEASE_ID: ${{ inputs.lease_id }}
      ATTEMPT: ${{ inputs.attempt }}
      OWNER_EPOCH: ${{ inputs.owner_epoch }}
      INPUT_COMMIT: ${{ inputs.input_commit }}
      TASK_PAYLOAD_REF: ${{ inputs.task_payload_ref }}
      TASK_PAYLOAD_JSON: ${{ inputs.task_payload_json }}
      ROLE: ${{ inputs.role }}
      PROVIDER_RUN_ID: ${{ github.run_id }}
      EVIDENCE_DIR: .p3-worker
    steps:
      - name: Checkout immutable input revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.input_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate worker correlation
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$INPUT_COMMIT"
          test "$JOB_ID" != ""
          test "$TASK_ID" != ""
          test "$LEASE_ID" != ""
          test "$ATTEMPT" -ge 1
          [[ "$OWNER_EPOCH" =~ ^[1-9][0-9]*$ ]]
          test "$TASK_PAYLOAD_REF" != ""
          test "$ROLE" != ""
          if [ -n "$TASK_PAYLOAD_JSON" ]; then
            printf '%s' "$TASK_PAYLOAD_JSON" | node --input-type=module -e "import('node:fs').then(fs=>import('./src/runtime/strict-json.js').then(({parseStrictJson})=>parseStrictJson(fs.readFileSync(0,'utf8'),'task payload')));"
          else
            test -f "$TASK_PAYLOAD_REF"
            TASK_PAYLOAD_REF="$TASK_PAYLOAD_REF" node --input-type=module -e "import('node:fs').then(fs=>import('./src/runtime/strict-json.js').then(({parseStrictJson})=>parseStrictJson(fs.readFileSync(process.env.TASK_PAYLOAD_REF,'utf8'),'task payload')));"
          fi

      - name: Validate runtime dependencies
        run: |
          set -Eeuo pipefail
          node --version
          git --version
          tmux -V
          test -x "$(command -v node)"

      - name: Execute through ExecutionManager
        run: |
          set -Eeuo pipefail
          node scripts/run-worker-task.js

      - name: Validate result envelope
        if: always()
        run: |
          set -Eeuo pipefail
          test -f .p3-worker/result.json
          node --input-type=module -e "import('node:fs').then(fs=>import('./src/runtime/strict-json.js').then(({parseStrictJson})=>import('./src/runtime/execution-contract.js').then(({validateExecutionResult})=>validateExecutionResult(parseStrictJson(fs.readFileSync('.p3-worker/result.json','utf8'),'worker result')))));"

      - name: Upload worker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-worker-${{ github.run_id }}
          path: .p3-worker/**
          include-hidden-files: true
          if-no-files-found: error
